name: Capture Sleeper waiver snapshots

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run capture:waivers
      - name: Commit snapshot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze/sleeper data/silver/waiver_snapshots.parquet data/silver/sleeper_players.parquet data/silver/unmatched_sleeper_players.json
          git diff --cached --quiet || git commit -m "chore: capture Sleeper waiver snapshot"
          git push
