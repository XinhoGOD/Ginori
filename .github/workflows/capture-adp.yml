name: Capture live ADP from ESPN Sleeper Yahoo

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run capture:adp
      - name: Commit ADP snapshot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/silver/adp_snapshots.parquet
          git diff --cached --quiet || git commit -m "chore: capture live ADP snapshot"
          git push
